<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script>
(()=>{const q=new URLSearchParams(location.search);const facility=String(q.get('shop_code')||'pet_salon_demo').trim();window.DPRO_AUTH_CONFIG={project:'GENERAL',system:'PETSALON',facility,protectedApiOrigins:['https://dpro-pet-salon-api.dpromstk2000.workers.dev']};})();
</script>
<script src="./dpro-auth-guard.js?v=DPRO-AUTH-5-R4-20260809"></script>
<title>DPRO PET SALON｜ホテル営業設定</title>
<style>
:root{--bg:#fffaf4;--card:#fff;--ink:#2f2722;--muted:#7d6f66;--line:#eadfd5;--main:#8a5a3c;--ok:#2f7d55;--danger:#b54747;--soft:#fff4ea}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink)}.wrap{max-width:980px;margin:auto;padding:24px 14px 60px}.hero{background:linear-gradient(135deg,#3f2b22,#8a5a3c);color:#fff;border-radius:26px;padding:22px}.hero h1{margin:4px 0 6px;font-size:26px}.hero p{margin:0;color:#f6e9df}.grid{display:grid;gap:14px;margin-top:14px}@media(min-width:760px){.grid.two{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:repeat(3,1fr)}}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 10px 28px rgba(70,42,25,.06)}h2{font-size:19px;margin:0 0 8px}.muted{color:var(--muted);font-size:13px}label{display:block;font-weight:800;font-size:13px;margin:10px 0 5px}input,select{width:100%;border:1px solid #ddd2c9;border-radius:13px;padding:11px;background:#fff}.check{display:flex;gap:8px;align-items:center;margin:10px 0;font-weight:800}.check input{width:auto}.btn{border:0;background:var(--main);color:#fff;border-radius:13px;padding:11px 14px;font-weight:900;cursor:pointer}.btn.secondary{background:#fff;color:var(--main);border:1px solid var(--line)}.btn.danger{background:var(--danger)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.notice{margin-top:12px;padding:12px;border-radius:14px;background:var(--soft);font-size:13px}.ok{color:var(--ok);font-weight:900}.err{color:var(--danger);font-weight:900}.list{display:grid;gap:8px;margin-top:12px}.row{border:1px solid var(--line);border-radius:14px;padding:11px;background:#fff}.row strong{display:block}
</style>
</head>
<body><div class="wrap">
<div class="hero"><div>DPRO PET SALON</div><h1>ペットホテル営業設定</h1><p>サロン定休日とホテル営業を分けて管理します。</p></div>
<div class="grid two">
<section class="card"><h2>基本設定</h2><p class="muted">店舗ごとのホテル運用をプリセット＋個別スイッチで設定できます。</p>
<label>1日最大預かり頭数</label><input id="capacity" type="number" min="1" max="50">
<label>ホテル営業モード</label><select id="mode"><option value="always_open">365日ホテル営業</option><option value="holiday_handoff">定休日も宿泊継続・受け渡し時間制限</option><option value="closed_with_salon">サロン休業日にホテルも休業</option><option value="custom">個別設定</option></select>
<label class="check"><input id="stay" type="checkbox">サロン定休日も宿泊継続を許可</label>
<label class="check"><input id="checkin" type="checkbox">サロン定休日のチェックインを許可</label>
<label class="check"><input id="checkout" type="checkbox">サロン定休日のチェックアウトを許可</label>
<div class="grid two"><div><label>受け渡し開始</label><input id="start" type="time"></div><div><label>受け渡し終了</label><input id="end" type="time"></div></div>
<div class="actions"><button class="btn" id="save">基本設定を保存</button><a class="btn secondary" href="owner.html">管理画面へ戻る</a></div><div id="status" class="notice">読み込み中…</div></section>
<section class="card"><h2>特別日の上書き</h2><p class="muted">年末年始・臨時対応など、日付ごとに基本設定を上書きします。「基本設定を使う」は継承です。</p>
<label>日付</label><input id="specialDate" type="date">
<div class="grid three"><div><label>宿泊</label><select id="sStay"><option value="">基本設定</option><option value="true">可</option><option value="false">不可</option></select></div><div><label>チェックイン</label><select id="sIn"><option value="">基本設定</option><option value="true">可</option><option value="false">不可</option></select></div><div><label>チェックアウト</label><select id="sOut"><option value="">基本設定</option><option value="true">可</option><option value="false">不可</option></select></div></div>
<div class="grid two"><div><label>受け渡し開始</label><input id="sStart" type="time"></div><div><label>受け渡し終了</label><input id="sEnd" type="time"></div></div>
<label>理由</label><input id="reason" placeholder="年末年始・臨時休業など">
<div class="actions"><button class="btn" id="saveSpecial">特別日を保存</button><button class="btn danger" id="deleteSpecial">この日の上書きを削除</button></div><div id="specialStatus" class="notice">特別日を選択してください。</div></section>
</div>
<section class="card" style="margin-top:14px"><h2>今後の特別日設定</h2><div id="specialList" class="list"><div class="muted">読み込み中…</div></div></section>
</div>
<script>
(()=>{const API='https://dpro-pet-salon-api.dpromstk2000.workers.dev';const q=new URLSearchParams(location.search);const shop=q.get('shop_code')||'pet_salon_demo';const $=id=>document.getElementById(id);const api=async(path,opt={})=>{const r=await fetch(API+path,{cache:'no-store',...opt,headers:{...(opt.body?{'Content-Type':'application/json'}:{}),...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw new Error(d.error||d.message||`API ${r.status}`);return d};const boolVal=v=>v===''?null:v==='true';
async function load(){try{const d=await api(`/api/admin/settings?shop_code=${encodeURIComponent(shop)}`);const s=d.settings||{};$('capacity').value=s.hotel_max_pets_per_day||3;$('mode').value=s.hotel_operation_mode||'holiday_handoff';$('stay').checked=s.hotel_holiday_stay_allowed!==false;$('checkin').checked=s.hotel_holiday_checkin_allowed!==false;$('checkout').checked=s.hotel_holiday_checkout_allowed!==false;$('start').value=String(s.hotel_holiday_handoff_start||'10:00').slice(0,5);$('end').value=String(s.hotel_holiday_handoff_end||'11:00').slice(0,5);$('status').innerHTML='<span class="ok">DPRO本体から設定を読み込みました。</span>';await loadSpecial();}catch(e){$('status').innerHTML=`<span class="err">${e.message}</span>`}}
$('mode').addEventListener('change',()=>{const m=$('mode').value;if(m==='always_open'){$('stay').checked=true;$('checkin').checked=true;$('checkout').checked=true}if(m==='closed_with_salon'){$('stay').checked=false;$('checkin').checked=false;$('checkout').checked=false}if(m==='holiday_handoff'){$('stay').checked=true;$('checkin').checked=true;$('checkout').checked=true;$('start').value=$('start').value||'10:00';$('end').value=$('end').value||'11:00'}});
$('save').onclick=async()=>{try{const body={shop_code:shop,hotel_max_pets_per_day:Number($('capacity').value||3),hotel_operation_mode:$('mode').value,hotel_holiday_stay_allowed:$('stay').checked,hotel_holiday_checkin_allowed:$('checkin').checked,hotel_holiday_checkout_allowed:$('checkout').checked,hotel_holiday_handoff_start:$('start').value||'10:00',hotel_holiday_handoff_end:$('end').value||'11:00'};await api('/api/admin/settings/update',{method:'POST',body:JSON.stringify(body)});$('status').innerHTML='<span class="ok">保存しました。予約HPへ即時反映されます。</span>'}catch(e){$('status').innerHTML=`<span class="err">${e.message}</span>`}};
async function loadSpecial(){const from=new Date().toISOString().slice(0,10);try{const d=await api(`/api/admin/hotel-special-days?shop_code=${encodeURIComponent(shop)}&from=${from}`);const rows=d.days||[];$('specialList').innerHTML=rows.length?rows.map(x=>`<div class="row"><strong>${x.hotel_date} ${x.reason||''}</strong><span class="muted">宿泊:${x.stay_allowed===null?'継承':x.stay_allowed?'可':'不可'} / IN:${x.checkin_allowed===null?'継承':x.checkin_allowed?'可':'不可'} / OUT:${x.checkout_allowed===null?'継承':x.checkout_allowed?'可':'不可'}${x.handoff_start||x.handoff_end?` / ${String(x.handoff_start||'').slice(0,5)}〜${String(x.handoff_end||'').slice(0,5)}`:''}</span></div>`).join(''):'<div class="muted">特別日設定はありません。</div>'}catch(e){$('specialList').innerHTML=`<div class="err">${e.message}</div>`}}
$('saveSpecial').onclick=async()=>{if(!$('specialDate').value)return alert('日付を選択してください。');try{await api('/api/admin/hotel-special-days/upsert',{method:'POST',body:JSON.stringify({shop_code:shop,hotel_date:$('specialDate').value,stay_allowed:boolVal($('sStay').value),checkin_allowed:boolVal($('sIn').value),checkout_allowed:boolVal($('sOut').value),handoff_start:$('sStart').value||null,handoff_end:$('sEnd').value||null,reason:$('reason').value.trim()})});$('specialStatus').innerHTML='<span class="ok">特別日を保存しました。</span>';await loadSpecial()}catch(e){$('specialStatus').innerHTML=`<span class="err">${e.message}</span>`}};
$('deleteSpecial').onclick=async()=>{if(!$('specialDate').value)return alert('日付を選択してください。');if(!confirm('この日のホテル特別設定を削除しますか？'))return;try{await api('/api/admin/hotel-special-days/delete',{method:'POST',body:JSON.stringify({shop_code:shop,hotel_date:$('specialDate').value})});$('specialStatus').innerHTML='<span class="ok">削除しました。</span>';await loadSpecial()}catch(e){$('specialStatus').innerHTML=`<span class="err">${e.message}</span>`}};load()})();
</script></body></html>
