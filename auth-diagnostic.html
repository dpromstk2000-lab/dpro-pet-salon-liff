<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>DPRO AUTH診断</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;background:#f5f7fb;color:#172033;margin:0;padding:24px}
.wrap{max-width:760px;margin:auto}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px;box-shadow:0 12px 35px rgba(15,23,42,.08)}
h1{font-size:24px;margin:0 0 8px}.lead{color:#64748b;line-height:1.7}
.row{display:grid;grid-template-columns:190px 1fr;gap:12px;padding:13px 0;border-top:1px solid #eef2f7}
.name{font-weight:800}.ok{color:#15803d;font-weight:800}.ng{color:#b91c1c;font-weight:800}.wait{color:#475569;font-weight:800}
code{white-space:pre-wrap;word-break:break-word;font-size:12px}.note{margin-top:16px;padding:12px;border-radius:12px;background:#f8fafc;color:#64748b;font-size:13px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>DPRO OWNER AUTH 診断</h1>
<p class="lead">PET SALON DEMOの共通認証・本体Worker・追加WorkerをSMSなしで順番に確認します。</p>
<div id="results"></div>
<div class="note">生のセッショントークンは表示しません。DEMO管理コード1234のみを使用し、SMSは送信しません。</div>
</div></div>
<script>
(()=>{
"use strict";
const AUTH="https://dpro-owner-auth-general.dpromstk2000.workers.dev";
const CORE="https://dpro-pet-salon-api.dpromstk2000.workers.dev";
const EXT="https://dpro-pet-salon-next-api.dpromstk2000.workers.dev";
const identity={systemCode:"PETSALON",facilityCode:"pet_salon_demo"};
const steps=[
 ["status","① 共通認証 status"],
 ["login","② DEMO login"],
 ["session","③ 共通 session"],
 ["core","④ 本体Worker 管理API"],
 ["ext","⑤ 追加Worker 管理API"]
];
const box=document.getElementById("results"), nodes={};
for(const [k,label] of steps){
 const r=document.createElement("div"); r.className="row";
 r.innerHTML=`<div class="name">${label}</div><div><span class="wait">確認中...</span><div><code></code></div></div>`;
 box.appendChild(r); nodes[k]={state:r.querySelector("span"),code:r.querySelector("code")};
}
function set(k,ok,obj){
 nodes[k].state.className=ok?"ok":"ng"; nodes[k].state.textContent=ok?"OK":"NG";
 nodes[k].code.textContent=JSON.stringify(obj,null,2);
}
async function call(url,opt={}){
 try{
  const res=await fetch(url,{cache:"no-store",...opt});
  let data={}; try{data=await res.json()}catch{}
  return {ok:res.ok&&data.ok!==false,status:res.status,data};
 }catch(e){
  return {ok:false,status:0,data:{error:"FETCH_FAILED",message:String(e&&e.message||e)}};
 }
}
async function run(){
 const s=await call(AUTH+"/auth/status",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(identity)});
 set("status",s.ok,{http:s.status,error:s.data.error||null,systemCode:s.data.systemCode||null,facilityCode:s.data.facilityCode||null,environment:s.data.environment||null});
 if(!s.ok){["login","session","core","ext"].forEach(k=>set(k,false,{skipped:true}));return;}

 const l=await call(AUTH+"/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...identity,password:"1234",rememberMe:false})});
 const token=l.data&&l.data.sessionToken||"";
 set("login",l.ok&&!!token,{http:l.status,error:l.data.error||null,sessionTokenReceived:!!token,expiresAt:l.data.expiresAt||null});
 if(!l.ok||!token){["session","core","ext"].forEach(k=>set(k,false,{skipped:true}));return;}

 const h={Authorization:"Bearer "+token};
 const se=await call(AUTH+"/auth/session",{headers:h});
 set("session",se.ok,{http:se.status,error:se.data.error||null,message:se.data.message||null,systemCode:se.data.systemCode||null,facilityCode:se.data.facilityCode||null,authenticated:se.data.authenticated||false});

 const c=await call(CORE+"/api/admin/settings?shop_code=pet_salon_demo",{headers:h});
 set("core",c.ok,{http:c.status,error:c.data.error||null,detail:c.data.detail||null,shop_code:c.data.shop_code||null});

 const e=await call(EXT+"/api/admin/extension-settings?shop_code=pet_salon_demo",{headers:h});
 set("ext",e.ok,{http:e.status,error:e.data.error||null,detail:e.data.detail||null,shop_code:e.data.shop_code||null});
}
run();
})();
</script>
</body>
</html>
